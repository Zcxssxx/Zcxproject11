name: Check and Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: MoonBit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install native prerequisites on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Install native prerequisites on macOS
        if: matrix.os == 'macos-latest'
        run: brew install gcc

      - name: Install MoonBit on Unix
        if: matrix.os != 'windows-latest'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Setup MSYS2 native toolchain on Windows
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Verify toolchain and dependencies
        run: |
          moon version --all | tee moon-toolchain-version.txt
          grep -q "0.10.3" moon-toolchain-version.txt
          moon update

      - name: Format, check, and inspect API
        run: |
          moon fmt
          git diff --exit-code
          moon check --target all --deny-warn
          moon info
          git diff --exit-code

      - name: Build every declared target
        run: moon build --target all --deny-warn

      - name: Test every declared target
        run: moon test --target all --deny-warn

      - name: Re-run native integration target explicitly
        run: moon test --target native --deny-warn
